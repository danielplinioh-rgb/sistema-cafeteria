# Servidor web único: entrega os DOIS módulos e encaminha /api ao back-end.
#   /          -> módulo do CLIENTE (smartphone, aberto pelo QR Code)
#   /painel/   -> módulo do COLABORADOR (desktop, com login)
#   /api/      -> back-end Java (proxy)
#   /imagens/ e /config/ -> pasta "publico" montada como volume (troque arquivos sem recompilar)
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 64k;

    # Cabeçalhos de segurança (a API acrescenta os seus próprios).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    # Em produção com HTTPS (proxy/balanceador na frente), habilite:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # SOBRESCREVE (não acrescenta) o IP: o cliente não consegue forjar X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 15s;
    }

    location /imagens/ { alias /publico/imagens/; expires 1h; }
    location /config/  { alias /publico/config/;  add_header Cache-Control "no-cache"; }

    location /painel/ {
        alias /site/painel/;
        try_files $uri $uri/ /painel/index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        root /site/cliente;
        try_files $uri $uri/ /index.html;
    }
}
